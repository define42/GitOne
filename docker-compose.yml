services:
  gitone:
    image: gitone:local
    build:
      context: ./
    environment:
      - GITONE_RUNNER_TOKEN=${GITONE_RUNNER_TOKEN:-gitone-development-runner-token}
      - LDAP_URL=ldaps://ldap:389
      - LDAP_BASE_DN=dc=glauth,dc=com
      - LDAP_USER_DOMAIN=example.com
      - LDAP_USER_FILTER=(mail=%s)
      - LDAP_CANONICAL_ATTRIBUTE=mail
      - LDAP_SKIP_TLS_VERIFY=true
    depends_on:
      - ldap
    ports:
      - "8080:8080"
    volumes:
      - /data/:/data/
  gitone-runner:
    image: gitone-runner:local
    build:
      context: ./
      dockerfile: Dockerfile.runner
    command:
      - -runner-url
      - http://gitone:8080
      - -runner-id
      - docker-runner
      - -runner-workers
      - "1"
      - -runner-work-root
      - /var/lib/gitone-runner
    environment:
      - GITONE_RUNNER_TOKEN=${GITONE_RUNNER_TOKEN:-gitone-development-runner-token}
    depends_on:
      - gitone
    restart: unless-stopped
    volumes:
      - /var/lib/gitone-runner:/var/lib/gitone-runner
      - /var/run/docker.sock:/var/run/docker.sock
  ldap:
    image: glauth/glauth
    container_name: ldap
    restart: always
    ports:
      - "389:389"
    volumes:
      - ./testldap/default-config.cfg:/app/config/config.cfg
      - ./testldap/key.pem:/app/config/key.pem
      - ./testldap/cert.pem:/app/config/cert.pem
