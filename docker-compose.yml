services:
  gitone:
    image: gitone:local
    build:
      context: ./
    environment:
      - GITONE_RUNNER_TOKEN=${GITONE_RUNNER_TOKEN:-gitone-development-runner-token}
      - LDAP_URL=ldaps://ldap:389
      - LDAP_BASE_DN=dc=glauth,dc=com
      - LDAP_USER_DOMAIN=example.com
      - LDAP_USER_FILTER=(mail=%s)
      - LDAP_CANONICAL_ATTRIBUTE=mail
      - LDAP_SKIP_TLS_VERIFY=true
    depends_on:
      - ldap
    ports:
      - "8080:8080"
    volumes:
      - /data/:/data/
  gitone-runner:
    profiles:
      - libvirt-runner
    image: gitone-runner:local
    build:
      context: ./
      dockerfile: Dockerfile.runner
    command:
      - -runner-url
      - http://gitone:8080
      - -runner-id
      - kvm-runner
      - -runner-work-root
      - /var/lib/gitone-runner
      - -libvirt-idle-count
      - ${GITONE_LIBVIRT_IDLE_COUNT:-3}
      - -libvirt-max-instances
      - ${GITONE_LIBVIRT_MAX_INSTANCES:-5}
      - -libvirt-pool-path
      - ${GITONE_LIBVIRT_POOL_PATH:-/var/lib/libvirt/images}
      - -libvirt-base-volume
      - ${GITONE_LIBVIRT_BASE_VOLUME:-flatcar_production_qemu_image.img}
      - -libvirt-base-image-url
      - ${GITONE_LIBVIRT_BASE_IMAGE_URL:-https://stable.release.flatcar-linux.net/amd64-usr/4593.2.4/flatcar_production_qemu_image.img}
      - -libvirt-base-image-sha512
      - ${GITONE_LIBVIRT_BASE_IMAGE_SHA512:-9cd59da624ad47c58686ea05ab216e0343fa1181219f493f27a81256c68170817f2f40759f9437fad80958f671e658cff9f84a67b2cb40fdc90931ce74651a21}
      - -libvirt-network-cidr
      - ${GITONE_LIBVIRT_NETWORK_CIDR:-}
    environment:
      - GITONE_RUNNER_TOKEN=${GITONE_RUNNER_TOKEN:-gitone-development-runner-token}
    depends_on:
      - gitone
    restart: unless-stopped
    stop_grace_period: 3m
    security_opt:
      - label=disable
    volumes:
      - /var/lib/gitone-runner:/var/lib/gitone-runner
      - ${GITONE_LIBVIRT_SOCKET:-/var/run/libvirt/libvirt-sock}:/var/run/libvirt/libvirt-sock
      - ${GITONE_LIBVIRT_POOL_PATH:-/var/lib/libvirt/images}:${GITONE_LIBVIRT_POOL_PATH:-/var/lib/libvirt/images}
  ldap:
    image: glauth/glauth
    container_name: ldap
    restart: always
    ports:
      - "389:389"
    volumes:
      - ./testldap/default-config.cfg:/app/config/config.cfg
      - ./testldap/key.pem:/app/config/key.pem
      - ./testldap/cert.pem:/app/config/cert.pem
