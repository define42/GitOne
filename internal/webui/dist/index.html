<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitOne</title>
  <script>
    try {
      const theme = localStorage.getItem("gitone-color-theme");
      if (["light", "dark", "steampunk", "windows", "macosx", "ubuntu", "solaris", "github", "gitlab"].includes(theme)) {
        document.documentElement.dataset.theme = theme;
      }
    } catch {
      // Dark remains the default when browser storage is unavailable.
    }
  </script>
  <link rel="icon" href="/assets/gitone.png">
  <link rel="stylesheet" href="/assets/styles.css?v=4">
  <script type="importmap">
    {
      "imports": {
        "dompurify": "/assets/purify.es.mjs",
        "marked": "/assets/marked.esm.js"
      }
    }
  </script>
  <script src="/assets/diff.min.js"></script>
  <script type="module" src="/assets/app.js?v=24"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand-logo" href="/" aria-label="GitOne home">
        <img src="/assets/gitone.png" alt="GitOne">
      </a>
      <nav id="location-context" class="location-context" aria-label="Breadcrumb" hidden>
        <ol id="location-context-list"></ol>
      </nav>
      <nav id="global-navigation" class="global-navigation" aria-label="Global" hidden>
        <a href="/">Groups</a>
        <a href="/docs">API</a>
      </nav>
      <label class="theme-control" for="color-theme">
        <span>Theme</span>
        <select id="color-theme" aria-label="Color theme">
          <option value="dark" selected>Dark</option>
          <option value="light">Light</option>
          <option value="steampunk">Steampunk</option>
          <option value="windows">Windows</option>
          <option value="macosx">Mac OS X</option>
          <option value="ubuntu">Ubuntu</option>
          <option value="solaris">Solaris</option>
          <option value="github">GitHub</option>
          <option value="gitlab">GitLab</option>
        </select>
      </label>
      <div id="session-controls" class="session-controls" hidden>
        <span id="session-username"></span>
        <button id="logout" type="button" title="Sign out">Sign out</button>
      </div>
    </div>
  </header>
  <div id="notifications" class="notifications" aria-live="polite" aria-atomic="true"></div>
  <main id="app" class="app-shell">
    <p>Loading…</p>
  </main>
  <noscript>This UI requires JavaScript.</noscript>
</body>
</html>
