name: Go

on:
  push:
    branches: [ "main" ]
    tags-ignore:
      - "v*"          # prevent infinite loops when pushing tags
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  GOFIPS140: certified

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and verify generated UI assets
        run: make ui && git diff --exit-code

      - name: Lint
        run: make lint

      - name: Run tests with coverage
        run: |
          go test ./... -coverprofile=coverage.out -coverpkg=./...

      - name: Run strict FIPS diagnostic
        env:
          GODEBUG: fips140=only
        run: go test ./...

      - name: Show coverage in job summary
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          awk '
            /^total:/ {
              gsub(/%/, "", $3)
              coverage = $3 + 0
            }
            END {
              if (coverage < 85) {
                printf "coverage %.1f%% is below the required 85.0%%\n", coverage > "/dev/stderr"
                exit 1
              }
            }
          ' coverage.txt
          echo "## Go Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unittests
          fail_ci_if_error: true

  release:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          dry_run: true

      - name: Prepare container tags
        id: images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
          RELEASE_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          {
            echo 'server<<EOF'
            echo "${IMAGE_PREFIX}/gitone:latest"
            echo "${IMAGE_PREFIX}/gitone:${GITHUB_SHA}"
            if [ -n "${RELEASE_TAG}" ] && [ "${RELEASE_TAG}" != "undefined" ]; then
              echo "${IMAGE_PREFIX}/gitone:${RELEASE_TAG}"
            fi
            echo 'EOF'
            echo 'runner<<EOF'
            echo "${IMAGE_PREFIX}/gitone-runner:latest"
            echo "${IMAGE_PREFIX}/gitone-runner:${GITHUB_SHA}"
            if [ -n "${RELEASE_TAG}" ] && [ "${RELEASE_TAG}" != "undefined" ]; then
              echo "${IMAGE_PREFIX}/gitone-runner:${RELEASE_TAG}"
            fi
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.images.outputs.server }}

      - name: Build and push runner container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.runner
          push: true
          tags: ${{ steps.images.outputs.runner }}

      - name: Create release tag
        if: steps.version.outputs.new_tag != '' && steps.version.outputs.new_tag != 'undefined'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"
